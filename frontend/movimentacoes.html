<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Movimentações | Almoxarifado</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body data-page="movimentacoes">
    <aside>
      <div class="nav-heading"><h2>Almoxarifado</h2><button id="menuToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="primaryNav"><span></span><span></span><span></span></button></div>
      <nav id="primaryNav">
        <a href="dashboard.html">Painel</a>
        <a href="estoque.html">Estoque</a
        ><a href="movimentacoes.html">Movimentações</a
        ><a href="solicitacoes.html">Solicitações</a
        ><a href="produtos.html">Produtos</a
        ><a href="fornecedores.html">Fornecedores</a
        ><a href="relatorios.html">Relatórios</a
        ><a href="login.html" id="logout">Sair</a>
      </nav>
    </aside>
    <main>
      <header>
        Olá, <b id="userName">Usuário</b><small id="userRole"></small>
      </header>
      <section class="content">
        <h1>Movimentações</h1>
        <p>Histórico de entradas, saídas e ajustes</p>
        <div id="message" role="status"></div>
        <form id="actionForm" class="form">
          <label
            >Produto<select
              id="produto"
              name="produto_id"
              required
            ></select></label
          ><label
            >Tipo<select name="tipo_movimentacao">
              <option value="entrada">Entrada</option>
              <option value="saida">Saída</option>
              <option value="ajuste">Ajuste</option>
            </select></label
          ><label
            >Quantidade<input
              name="quantidade"
              type="number"
              min="0.01"
              step="0.01"
              required /></label
          ><label>Observação<input name="observacao" /></label
          ><button class="primary">Registrar movimentação</button>
        </form>
        <section class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Tipo</th>
                  <th>Quantidade</th>
                  <th>Responsável</th>
                  <th>Data</th>
                  <th>Observação</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script src="pages.js"></script>
  </body>
</html>
